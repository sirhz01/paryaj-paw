[package]
name = "paryaj-paw-boutik"
version = "0.1.0"
description = "Terminal de la boutique Paryaj Paw (caisse et écrans TV)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "paryaj_paw_boutik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
