<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paryaj Paw Boutik — Serveur</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 system-ui, "Segoe UI", sans-serif; background: #0c1016; color: #e8edf4; }
    .card { width: min(92vw, 440px); background: #151b24; border: 1px solid #243040; border-radius: 14px; padding: 28px; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 22px; color: #8a97a8; }
    label { display: block; font-size: 13px; color: #8a97a8; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 9px; border: 1px solid #2b3747; background: #0e141c; color: #e8edf4; }
    input:focus { outline: none; border-color: #2740d6; }
    .row { display: flex; gap: 10px; margin-top: 18px; }
    button { flex: 1; padding: 12px; font-size: 15px; font-weight: 600; border: 0; border-radius: 9px; cursor: pointer; }
    .primary { background: #e53935; color: #fff; } .ghost { background: #1e2733; color: #c7d2de; }
    .msg { margin-top: 14px; min-height: 20px; font-size: 14px; } .ok { color: #39d98a; } .err { color: #ff6b6b; }
    .hint { margin-top: 18px; font-size: 12px; color: #6b7889; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Paryaj Paw Boutik</h1>
    <p class="sub">Adresse du serveur de la boutique</p>
    <label for="server">Exemple : 192.168.1.10 ou http://192.168.1.10:3000</label>
    <input id="server" inputmode="url" autocomplete="off" placeholder="192.168.1.10:3000" autofocus>
    <div class="row">
      <button class="ghost" id="test">Tester</button>
      <button class="primary" id="save">Enregistrer</button>
    </div>
    <div class="msg" id="msg"></div>
    <p class="hint">Le port par défaut est 3000. Menu « Boutique » pour changer de serveur ou passer en plein écran.</p>
  </main>
  <script>
    const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
    const $ = (id) => document.getElementById(id);
    const msg = (t, c) => { $('msg').textContent = t; $('msg').className = 'msg ' + (c || ''); };

    function normalize(input) {
      let s = String(input || '').trim();
      if (!s) return '';
      if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
      if (!/:\d+(\/|$)/.test(s.replace(/^https?:\/\//i, ''))) s = s.replace(/\/+$/, '') + ':3000';
      return s.replace(/\/+$/, '');
    }
    async function test(server) {
      try {
        const res = await fetch(`${server}/api/v1/health`, { signal: AbortSignal.timeout(5000) });
        return res.ok ? { ok: true } : { ok: false, error: `Réponse ${res.status}` };
      } catch { return { ok: false, error: 'Serveur injoignable' }; }
    }

    invoke('get_server').then((s) => { if (s) $('server').value = s; });

    $('test').addEventListener('click', async () => {
      const server = normalize($('server').value); msg('Test en cours…');
      const r = await test(server); msg(r.ok ? `Serveur joignable : ${server}` : `Échec : ${r.error}`, r.ok ? 'ok' : 'err');
    });
    async function save() {
      const server = normalize($('server').value); msg('Vérification…');
      const r = await test(server);
      if (!r.ok) return msg(`Impossible d'enregistrer : ${r.error}`, 'err');
      await invoke('save_server', { url: server });
      window.location.href = server + '/';
    }
    $('save').addEventListener('click', save);
    $('server').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
  </script>
</body>
</html>
