  <link rel="stylesheet" href="css/legal.css">
  <style>
    form { display: grid; gap: .9rem; margin-top: 1rem; }
    label { display: grid; gap: .25rem; font-weight: 600; font-size: .9rem; }
    input, textarea { font: inherit; padding: .6rem; border: 1px solid #8a97ad; border-radius: 8px; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
    textarea { min-height: 8rem; resize: vertical; }
    button { justify-self: start; font: inherit; font-weight: 700; padding: .8rem 1.8rem; border: 0; border-radius: 10px; background: #b3211b; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    #status { font-weight: 600; min-height: 1.5rem; }
    #status.err { color: #a11a15; }
    #status.ok { color: #14573a; }
  </style>
</head>
<body>
  <header><a href="index.html"><img src="assets/logo.jpg" alt="La Référence Paryaj Paw"></a></header>
  <main>
    <h1>Nous contacter</h1>
    <p>Une question sur un ticket, un paiement ou votre compte ? Écrivez-nous, nous répondons par e-mail. Vos données sont traitées comme indiqué dans la <a href="rgpd.html">politique de confidentialité</a>.</p>
    <form id="contact" novalidate>
      <label>Nom<input id="name" name="name" autocomplete="name" required minlength="2" maxlength="80"></label>
      <label>E-mail<input id="email" name="email" type="email" autocomplete="email" required maxlength="160"></label>
      <label>Message<textarea id="message" name="message" required minlength="10" maxlength="2000"></textarea></label>
      <div class="hp" aria-hidden="true"><label>Ne pas remplir<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
      <p id="status" role="status" aria-live="polite"></p>
      <button type="submit" id="send">Envoyer</button>
    </form>
  </main>
  <nav class="legal"><a href="index.html">Accueil</a><a href="cgu.html">Conditions générales d’utilisation</a><a href="rgpd.html">Politique de confidentialité</a></nav>
  <script src="js/contact.js" defer></script>
  <script src="js/consent.js" defer></script>
</body>
</html>
