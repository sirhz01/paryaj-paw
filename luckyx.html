<body class="tv luckyx" data-phase="bet">
  <header id="topbar"></header>
  <main class="stage">
    <section class="promo" id="promo">
      <div class="slide on">
        <div class="small" style="opacity:.7;font-size:1rem">Choisissez de 1 à 10 numéros</div>
        <div class="mid" style="font-weight:400;font-size:4rem;line-height:1">Lucky X</div>
        <div class="big" style="color:#fff;font-size:2.6rem">Parmi 50 numéros</div>
        <div class="small" style="opacity:.7;font-size:1rem">Tous dans les 36 boules tirées : plus ils sortent tôt, plus vous gagnez</div>
      </div>
      <div class="slide">
        <div class="small">Gain maximum selon le nombre de numéros choisis</div>
        <div class="legend" id="tiers" style="gap:1.6rem;margin-top:1rem"></div>
        <div class="small" style="font-size:1rem;opacity:.7">Prochain tour dans <b id="left">0:00</b></div>
      </div>
    </section>

    <section class="cy-board">
      <div class="cy-side l" id="sl"></div>
      <div class="cy-drum"><canvas id="drum"></canvas><div class="bigball" id="bigBall"></div><div class="hole"></div></div>
      <div class="cy-done">ROUND <span id="doneRound"></span><br>TERMINÉ</div>
      <div class="cy-side r" id="sr"></div>
      <div class="cy-results" id="cyRes"></div>
      <div class="cy-strip" id="strip"></div>
    </section>
    <div class="fs-hint">F = plein écran</div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/roulette-core.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
